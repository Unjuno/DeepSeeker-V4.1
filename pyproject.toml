[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseeker-v41"
version = "0.0.1"
description = "Experimental Apple Silicon inference acceleration for DeepSeek-V4.1-Flash"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Unjuno" }
]
dependencies = [
  "huggingface_hub>=0.34,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
